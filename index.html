<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>濁水溪口｜招潮蟹 AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
  </style>

  <script>
    AFRAME.registerComponent('target-events', {
      init: function () {
        const target = this.el;

        target.addEventListener('targetFound', function () {
          document.getElementById('status').textContent = '辨識成功！';
        });

        target.addEventListener('targetLost', function () {
          document.getElementById('status').textContent = '請對準招潮蟹圖卡';
        });
      }
    });
  </script>
</head>

<body>
  <div class="ar-container">

    <div id="status" style="
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:9999;
      padding:12px 20px;
      background:rgba(0,0,0,0.65);
      color:white;
      border-radius:12px;
      font-family:sans-serif;
      white-space:nowrap;
      pointer-events:none;
    ">
      請對準招潮蟹圖卡
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets1.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 5;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>

      <a-assets></a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        mindar-image-target="targetIndex: 0"
        target-events>
      </a-entity>

    </a-scene>
  </div>
</body>
</html>
